<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Chat AI</title>
    <style>
        * {
            font-family: Trebuchet MS;
            font-weight: 200;
        }

        button {
            user-select: none;    
            -webkit-user-select: none; 
            -ms-user-select: none;  
        }

        .button {
            cursor: pointer;
            background-color: black;
            color: white;
            border-radius: 25px;
            border: 2px solid black;
            padding: 0.5em 1em;
            transition: all 0.5s ease;
            font-size: 1.2em; 
            font-weight: 400;
            margin: 1em 0 1em 0;
            display: block;
        }

        .message {
            font-weight: 400;
            transition: all 0.5s ease;
        }
        .p {
            padding: 1em;
        }
        .text {
            border-radius: 5px;
            border: 1px solid rgba(0, 0, 0, 0.1);
            margin: 1em 0 1em 0;
        }
        .wrapper {
            width: 80%;
            margin: 2em auto 0 auto;
        }
        .green {
            color: green;
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <button id="btn" class="button">Tap & Hold to Speak</button>
        <i style="color: grey;">Pressing & holding space bar also works</i>
        
        <fieldset class="p text">
            <legend class="p">You said: </legend>
            <span id="input"></span>
        </fieldset>
        
        <fieldset class="p text">
            <legend class="p">Response: </legend>
            <span id="output"></span>
        </fieldset>
    </div>

    <script>
        const groqAPIKey = prompt('Groq API Key:');
        const listeningMessage = 'Listening...';
        const messageElement = document.getElementById('message');
        const inputElement = document.getElementById('input');
        const outputElement = document.getElementById('output');
        const buttonElement = document.getElementById('btn');
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.interimResults = false;
        recognition.lang = 'en-US';
        recognition.continuous = false;

       
        let isListening = false;
        const startListening = () => {
            buttonElement.classList.add('bg-green');
            buttonElement.innerText = listeningMessage;
            speechSynthesis.cancel();
            buttonElement.style.borderColor = 'green';
            buttonElement.style.backgroundColor = 'green';
            if (!isListening) {
                    isListening = true;
                    recognition.start();
            }
        }

        const stopListening = () => {
            buttonElement.style.borderColor = 'black';
            buttonElement.style.backgroundColor = 'black';
            buttonElement.innerText = 'Tap & Hold to Speak';
            isListening = false;
            recognition.stop();
        }

        document.addEventListener('keydown', (event) => {
            if (event.code === 'Space') {
                event.preventDefault();
                startListening();
            }
        });

        document.addEventListener('keyup', (event) => {
            if (event.code === 'Space') {
                stopListening();
            }
        });
        

        buttonElement.addEventListener('mousedown', startListening);
        buttonElement.addEventListener('touchstart', startListening);
        buttonElement.addEventListener('mouseup', stopListening);
        buttonElement.addEventListener('mouseleave', stopListening);
        buttonElement.addEventListener('touchend', stopListening);

        recognition.addEventListener('result', (event) => {
            const transcript = event.results[0][0].transcript;
            inputElement.innerHTML = `<p class="message">${transcript}</p>`;
            outputElement.innerHTML = `<p class="message">Loading...</p>`;
            console.log(transcript);
            const prompt = transcript.replace(/[^a-zA-Z0-9 ]/g, '');
            fetch(`https://api.groq.com/openai/v1/chat/completions`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${groqAPIKey}`
                },
                body: JSON.stringify({
                    "model": "llama3-8b-8192",
                    "messages": [{
                        "role": "user",
                        "content": prompt
                    }]
                })
            }).then(response => response.json())
            .then(data => {
                outputElement.innerText = data.choices[0].message.content;
                const utterance = new SpeechSynthesisUtterance(outputElement.innerText);
                utterance.lang = 'en-US';
                utterance.rate = 1.0;
                utterance.pitch = 1.0;
                speechSynthesis.speak(utterance);
            }).catch(error => {
                console.error('Error:', error);
                outputElement.innerHTML = `<p class="message">Error: Invalid API key.</p>`;
            });
    })
    </script>
</body>
</html>
